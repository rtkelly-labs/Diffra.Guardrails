name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'merge_group' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: '**/*.md'
      - name: JSON
        run: |
          status=0
          while IFS= read -r -d '' file; do
            jq empty "$file" || { echo "::error file=$file::not valid JSON"; status=1; }
          done < <(git ls-files -z '*.json')
          exit "$status"
